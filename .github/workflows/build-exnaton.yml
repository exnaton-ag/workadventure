name: Build, push, test and deploy custom Exnaton Docker image

on:
  push:
    branches: [exnaton-master]
  release:
    types: [created]

env:
  AWS_REGION: eu-central-1
  ECR_REPOSITORY: 458972843250.dkr.ecr.eu-central-1.amazonaws.com/workadventure-play

jobs:
  build-play:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      # docker
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Configure AWS credentials
        if: ${{ github.event_name == 'push' || github.event_name == 'release' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        if: ${{ github.event_name == 'push' || github.event_name == 'release' }}
        uses: aws-actions/amazon-ecr-login@v2

      - name: Inject slugshort variables
        uses: rlespinasse/github-slug-action@v4

      - name: Set "latest" tag for each branch
        if: ${{ github.event_name != 'release' }}
        run: echo "image_name_latest=${{ env.ECR_REPOSITORY }}:${{ env.GITHUB_REF_SLUG }}-latest" >> $GITHUB_ENV

      - name: Set immutable image tag
        run: echo "image_immutable_tag=${{ env.ECR_REPOSITORY }}:${{ env.GITHUB_REF_SLUG }}-$(date +%F.%H%M%S)-${{ env.GITHUB_SHA_SHORT }}" >> $GITHUB_ENV

      - name: Build and push
        uses: docker/build-push-action@v3
        if: ${{ github.event_name == 'push' || github.event_name == 'release' }}
        with:
          context: .
          file: play/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ env.image_name_latest }},${{ env.image_immutable_tag }}
